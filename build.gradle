plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

configurations {
    // Loom's include configuration is non-transitive by default.
    // The OpenAI SDK needs its client/core/transport runtime graph
    // inside the distributable server mod.
    include {
        transitive = true
    }
}

loom {
    runs {
        server {
            ideConfigGenerated = true
        }
        remove client
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation "org.yaml:snakeyaml:2.7"
    include "org.yaml:snakeyaml:2.7"

    implementation "com.openai:openai-java:${project.openai_java_version}"
    include "com.openai:openai-java:${project.openai_java_version}"

    implementation "com.github.ben-manes.caffeine:caffeine:${project.caffeine_version}"
    include "com.github.ben-manes.caffeine:caffeine:${project.caffeine_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
}

processResources {
    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "mod_id": project.mod_id,
            "minecraft_version": project.minecraft_version,
            "loader_version": project.loader_version,
            "fabric_api_version": project.fabric_api_version,
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = Integer.parseInt(project.java_version)
}

java {
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)

    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}


tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
